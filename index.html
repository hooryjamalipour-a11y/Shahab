<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    #ar-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #chroma-video {
      display: none;
    }
  </style>
</head>
<body>

  <!-- دوربین مستقیم و خودکار -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- ویدیوی پرده سبز (کاملاً بی‌صدا و لوپ) -->
  <video id="chroma-video" src="character.mp4" loop muted playsinline autoplay crossorigin="anonymous"></video>

  <!-- بوم گرافیکی سه‌بعدی -->
  <canvas id="ar-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    (async function () {
      const cameraVideo = document.getElementById('camera-feed');
      const chromaVideo = document.getElementById('chroma-video');
      const canvas = document.getElementById('ar-canvas');

      // ۱. اجرای خودکار دوربین پشت
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        cameraVideo.srcObject = stream;
        await cameraVideo.play();
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          cameraVideo.srcObject = fallbackStream;
          await cameraVideo.play();
        } catch (e) {}
      }

      // اطمینان از بی‌صدا بودن کامل ویدیو
      chromaVideo.muted = true;
      chromaVideo.play().catch(() => {});

      // ۲. راه‌اندازی صحنه Three.js
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      // تنظیم ارتفاع زاویه دید دوربین در سطح چشم انسان
      camera.position.set(0, 1.6, 0);

      // ۳. شیدر حذف کروماکی (سبز) با کیفیت بالا
      const videoTexture = new THREE.VideoTexture(chromaVideo);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;

      const chromaKeyMaterial = new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.DoubleSide,
        uniforms: {
          uTexture: { value: videoTexture },
          uKeyColor: { value: new THREE.Color(0.05, 0.95, 0.05) },
          uSimilarity: { value: 0.40 },
          uSmoothness: { value: 0.10 },
          uSpill: { value: 0.15 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uTexture;
          uniform vec3 uKeyColor;
          uniform float uSimilarity;
          uniform float uSmoothness;
          uniform float uSpill;
          varying vec2 vUv;

          vec2 RGBtoUV(vec3 rgb) {
            return vec2(
              rgb.r * -0.169 + rgb.g * -0.331 + rgb.b *  0.500 + 0.5,
              rgb.r *  0.500 + rgb.g * -0.419 + rgb.b * -0.081 + 0.5
            );
          }

          void main() {
            vec4 texColor = texture2D(uTexture, vUv);
            float chromaDist = distance(RGBtoUV(texColor.rgb), RGBtoUV(uKeyColor));

            float baseMask = chromaDist - uSimilarity;
            float alpha = pow(clamp(baseMask / uSmoothness, 0.0, 1.0), 1.5);

            float spillVal = pow(clamp(baseMask / uSpill, 0.0, 1.0), 1.5);
            float desat = dot(texColor.rgb, vec3(0.299, 0.587, 0.114));
            vec3 cleanColor = mix(vec3(desat), texColor.rgb, spillVal);

            if (alpha < 0.02) discard;
            gl_FragColor = vec4(cleanColor, alpha);
          }
        `
      });

      // ۴. تنظیم اندازه واقعی کاراکتر (قد حدود ۱.۸۵ متر، هم‌قد افراد واقعی)
      const characterGroup = new THREE.Group();
      const charHeight = 1.85; // ارتفاع استاندارد یک انسان کامل
      const charAspect = 336 / 592;
      const charWidth = charHeight * charAspect;

      const planeGeo = new THREE.PlaneGeometry(charWidth, charHeight);
      planeGeo.translate(0, charHeight / 2, 0); // قرارگیری از کف پا به سمت بالا
      const characterMesh = new THREE.Mesh(planeGeo, chromaKeyMaterial);
      characterGroup.add(characterMesh);

      // قرار دادن کاراکتر دقیقاً رو‌به‌روی دید دوربین در فاصله مناسب (مثل یک انسان ایستاده روبه‌رو)
      // فاصله ۲.۲ متری باعث می‌شود دقیقاً هم‌اندازه مردهای درون واگن مترو یا محیط دیده شود
      characterGroup.position.set(0, -0.2, -2.2);
      scene.add(characterGroup);

      // ۵. ثابت نگه داشتن کاراکتر در زاویه مستقیم رو‌به‌روی دوربین بدون کوچک شدن روی زمین
      function animate() {
        requestAnimationFrame(animate);

        // چرخش کاراکتر دقیقاً به سمت دوربین به صورت فیکس و طبیعی
        characterGroup.lookAt(camera.position.x, characterGroup.position.y, camera.position.z);

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
