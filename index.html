<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    #ar-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
    }
    #chroma-video {
      display: none;
    }
  </style>
</head>
<body>

  <!-- تصویر زنده دوربین -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- ویدیوی کاراکتر پرده سبز -->
  <video id="chroma-video" src="character.mp4" loop muted playsinline autoplay crossorigin="anonymous"></video>

  <!-- بوم رندر سه بعدی واقعیت افزوده -->
  <canvas id="ar-canvas"></canvas>

  <!-- کتابخانه Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    (async function () {
      const cameraVideo = document.getElementById('camera-feed');
      const chromaVideo = document.getElementById('chroma-video');
      const canvas = document.getElementById('ar-canvas');

      // ۱. باز شدن مستقیم و خودکار دوربین پشت
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        cameraVideo.srcObject = stream;
        await cameraVideo.play();
      } catch (err) {
        // در صورت عدم دسترسی به دوربین پشت، باز کردن دوربین پیش‌فرض
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          cameraVideo.srcObject = fallbackStream;
          await cameraVideo.play();
        } catch (e) {}
      }

      // پخش خودکار ویدیوی کاراکتر (و فعال‌سازی صدا در صورت لمس صفحه)
      chromaVideo.play().catch(() => {});
      window.addEventListener('pointerdown', () => {
        if (chromaVideo.paused) chromaVideo.play();
        chromaVideo.muted = false;
      }, { once: true });

      // ۲. راه‌اندازی صحنه سه‌بعدی Three.js
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        500
      );
      camera.position.set(0, 1.6, 0); // ارتفاع استاندارد دید انسان (۱.۶ متر)

      // ۳. شیدر هوشمند حذف پرده سبز (Chroma Key + Spill Suppression)
      const videoTexture = new THREE.VideoTexture(chromaVideo);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;

      const chromaKeyMaterial = new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.DoubleSide,
        uniforms: {
          uTexture: { value: videoTexture },
          uKeyColor: { value: new THREE.Color(0.05, 0.95, 0.05) },
          uSimilarity: { value: 0.42 },
          uSmoothness: { value: 0.12 },
          uSpill: { value: 0.18 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uTexture;
          uniform vec3 uKeyColor;
          uniform float uSimilarity;
          uniform float uSmoothness;
          uniform float uSpill;
          varying vec2 vUv;

          vec2 RGBtoUV(vec3 rgb) {
            return vec2(
              rgb.r * -0.169 + rgb.g * -0.331 + rgb.b *  0.500 + 0.5,
              rgb.r *  0.500 + rgb.g * -0.419 + rgb.b * -0.081 + 0.5
            );
          }

          void main() {
            vec4 texColor = texture2D(uTexture, vUv);
            float chromaDist = distance(RGBtoUV(texColor.rgb), RGBtoUV(uKeyColor));

            float baseMask = chromaDist - uSimilarity;
            float alpha = pow(clamp(baseMask / uSmoothness, 0.0, 1.0), 1.5);

            // حذف بازتاب رنگ سبز از لبه‌های کاراکتر
            float spillVal = pow(clamp(baseMask / uSpill, 0.0, 1.0), 1.5);
            float desat = dot(texColor.rgb, vec3(0.299, 0.587, 0.114));
            vec3 cleanColor = mix(vec3(desat), texColor.rgb, spillVal);

            if (alpha < 0.02) discard;
            gl_FragColor = vec4(cleanColor, alpha);
          }
        `
      });

      // ۴. ساخت مدل کاراکتر با ابعاد واقعی (ارتفاع ۲.۸ متر به همراه پرچم)
      const characterGroup = new THREE.Group();
      const charHeight = 2.8;
      const charAspect = 336 / 592; // نسبت تصویر ویدیو
      const charWidth = charHeight * charAspect;

      const planeGeo = new THREE.PlaneGeometry(charWidth, charHeight);
      // انتقال نقطه ثبات (Pivot) به کف پای کاراکتر
      planeGeo.translate(0, charHeight / 2, 0);
      const characterMesh = new THREE.Mesh(planeGeo, chromaKeyMaterial);
      characterGroup.add(characterMesh);

      // ایجاد سایه طبیعی زیر پای کاراکتر روی سطح محیط
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 128;
      shadowCanvas.height = 128;
      const sCtx = shadowCanvas.getContext('2d');
      const grad = sCtx.createRadialGradient(64, 64, 8, 64, 64, 60);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 128, 128);

      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      const shadowGeo = new THREE.PlaneGeometry(charWidth * 0.9, charWidth * 0.5);
      shadowGeo.rotateX(-Math.PI / 2);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        depthWrite: false
      });
      const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.position.y = 0.01;
      characterGroup.add(shadowMesh);

      characterGroup.visible = false;
      scene.add(characterGroup);

      // ۵. اسکنر هوشمند محیط (تشخیص سطوح صاف، پیاده‌رو، خیابان و لبه پشت‌بام)
      const scanCanvas = document.createElement('canvas');
      const scanWidth = 96;
      const scanHeight = 96;
      scanCanvas.width = scanWidth;
      scanCanvas.height = scanHeight;
      const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

      let devicePitch = 0; // زاویه بالا/پایین گوشی (به رادیان)
      let deviceRoll = 0;
      let deviceYaw = 0;
      let hasSensor = false;

      window.addEventListener('deviceorientation', (e) => {
        if (e.beta !== null && e.gamma !== null) {
          hasSensor = true;
          // تبدیل زاویه گوشی به زاویه دید دوربین
          const betaRad = THREE.MathUtils.degToRad(e.beta);
          const gammaRad = THREE.MathUtils.degToRad(e.gamma);
          const alphaRad = THREE.MathUtils.degToRad(e.alpha || 0);

          devicePitch = betaRad - Math.PI / 2;
          deviceRoll = gammaRad;
          deviceYaw = alphaRad;
        }
      });

      // تابع اسکن تصویر دوربین برای یافتن بهترین سطح افقی (پیاده‌رو/خیابان یا لبه پشت‌بام)
      function scanEnvironmentForSurface(preferredNormalizedX = null, preferredNormalizedY = null) {
        if (cameraVideo.readyState < 2) return null;

        scanCtx.drawImage(cameraVideo, 0, 0, scanWidth, scanHeight);
        const imgData = scanCtx.getImageData(0, 0, scanWidth, scanHeight).data;

        let bestScore = -1;
        let bestX = scanWidth / 2;
        let bestY = Math.floor(scanHeight * 0.72);

        const minY = Math.floor(scanHeight * 0.20);
        const maxY = Math.floor(scanHeight * 0.88);
        const minX = Math.floor(scanWidth * 0.20);
        const maxX = Math.floor(scanWidth * 0.80);

        for (let y = minY; y < maxY; y += 2) {
          for (let x = minX; x < maxX; x += 2) {
            const idx = (y * scanWidth + x) * 4;
            const idxAbove = ((y - 2) * scanWidth + x) * 4;
            const idxBelow = ((y + 2) * scanWidth + x) * 4;
            const idxLeft = (y * scanWidth + (x - 2)) * 4;
            const idxRight = (y * scanWidth + (x + 2)) * 4;

            const lum = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
            const lumAbove = 0.299 * imgData[idxAbove] + 0.587 * imgData[idxAbove + 1] + 0.114 * imgData[idxAbove + 2];
            const lumBelow = 0.299 * imgData[idxBelow] + 0.587 * imgData[idxBelow + 1] + 0.114 * imgData[idxBelow + 2];
            const lumLeft = 0.299 * imgData[idxLeft] + 0.587 * imgData[idxLeft + 1] + 0.114 * imgData[idxLeft + 2];
            const lumRight = 0.299 * imgData[idxRight] + 0.587 * imgData[idxRight + 1] + 0.114 * imgData[idxRight + 2];

            // لبه‌های افقی قوی و پیوستگی افقی (مشخصه لبه پشت‌بام، جدول خیابان یا کف پیاده‌رو)
            const verticalGrad = Math.abs(lumAbove - lumBelow);
            const horizontalContinuity = 255 - Math.abs(lumLeft - lumRight);

            let score = verticalGrad * 0.6 + horizontalContinuity * 0.4;

            // اولویت به مرکز تصویر یا نقطه لمس شده توسط کاربر
            const normX = x / scanWidth;
            const normY = y / scanHeight;
            if (preferredNormalizedX !== null && preferredNormalizedY !== null) {
              const distToTap = Math.hypot(normX - preferredNormalizedX, normY - preferredNormalizedY);
              score *= Math.max(0.1, 1.5 - distToTap * 3.0);
            } else {
              const centerBias = 1.0 - Math.abs(normX - 0.5) * 0.8;
              score *= centerBias;
            }

            if (score > bestScore) {
              bestScore = score;
              bestX = x;
              bestY = y;
            }
          }
        }

        return {
          ndcX: (bestX / scanWidth) * 2 - 1,
          ndcY: -(bestY / scanHeight) * 2 + 1,
          screenRatioY: bestY / scanHeight
        };
      }

      // ۶. محاسبه موقعیت سه‌بعدی و مقیاس واقعی متناسب با فاصله در محیط
      const targetPosition = new THREE.Vector3(0, 0, -5);
      let isPlaced = false;

      function placeCharacterSmartly(prefX = null, prefY = null) {
        const surface = scanEnvironmentForSurface(prefX, prefY);
        if (!surface) return;

        // تخمین فاصله واقعی (بر حسب متر) بر اساس پرسپکتیو عمودی و زاویه دوربین
        // نقاط پایین‌تر تصویر نزدیک‌تر (پیاده‌رو: ۳ تا ۶ متر) و نقاط بالاتر دورتر (خیابان یا پشت‌بام: ۱۰ تا ۳۵ متر) هستند
        const verticalFactor = Math.clamp
          ? Math.clamp(surface.screenRatioY, 0.15, 0.92)
          : Math.max(0.15, Math.min(0.92, surface.screenRatioY));

        let estimatedDistance;
        if (verticalFactor > 0.55) {
          // ناحیه زمین، پیاده‌رو یا خیابان نزدیک
          estimatedDistance = 3.2 + (1.0 - verticalFactor) * 14.0;
        } else {
          // ناحیه دورتر یا ارتفاع (مانند پشت‌بام ساختمان‌ها)
          estimatedDistance = 10.0 + (0.55 - verticalFactor) * 45.0;
        }

        // تبدیل نقطه تشخیص داده شده روی صفحه به مختصات سه‌بعدی جهان واقعی
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(surface.ndcX, surface.ndcY), camera);

        const worldPos = new THREE.Vector3();
        raycaster.ray.at(estimatedDistance, worldPos);

        targetPosition.copy(worldPos);
        if (!isPlaced) {
          characterGroup.position.copy(targetPosition);
          characterGroup.visible = true;
          isPlaced = true;
        }
      }

      // اسکن اولیه خودکار به محض آماده شدن تصویر دوربین
      const scanInterval = setInterval(() => {
        if (!isPlaced && cameraVideo.readyState >= 2) {
          placeCharacterSmartly();
        }
      }, 400);

      // امکان جابجایی هوشمند کاراکتر به هر نقطه دلخواه (مثلاً روی یک پشت‌بام خاص یا پیاده‌رو) با لمس صفحه
      window.addEventListener('pointerdown', (event) => {
        const normX = event.clientX / window.innerWidth;
        const normY = event.clientY / window.innerHeight;
        placeCharacterSmartly(normX, normY);
      });

      // ۷. حلقه رندر بلادرنگ و هماهنگی با چرخش گوشی
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // اعمال چرخش ژیروسکوپ به دوربین سه‌بعدی در صورت وجود سنسور
        if (hasSensor) {
          camera.rotation.order = 'YXZ';
          camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, devicePitch, 0.15);
          camera.rotation.y = THREE.MathUtils.lerp(camera.rotation.y, -deviceYaw * 0.25, 0.15);
          camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, -deviceRoll * 0.15, 0.15);
        }

        if (isPlaced) {
          // حرکت نرم کاراکتر به نقطه اسکن شده
          characterGroup.position.lerp(targetPosition, Math.min(1, delta * 6));

          // چرخش همیشگی صفحه کاراکتر به سمت دوربین (Billboarding افقی) تا طبیعی دیده شود
          const lookTarget = new THREE.Vector3(
            camera.position.x,
            characterGroup.position.y,
            camera.position.z
          );
          characterGroup.lookAt(lookTarget);
        }

        renderer.render(scene, camera);
      }

      animate();

      // تطبیق خودکار با تغییر ابعاد صفحه
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
